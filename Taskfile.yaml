# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: '3'

env:
  UV_LOCKED: 1
  PUSHOVER_PUSH_TOKEN: placeholder
  PUSHOVER_PUSH_USER: placeholder
vars:
  DOCKER_REPO: ghcr.io/kkweon/camply

tasks:
  # =============================================================
  # Setup
  # =============================================================
  default:
    desc: Install Project, List Tasks
    cmds:
      - task --list-all
    deps: [sync]

  install:
    desc: Install Project + Dev Dependencies
    cmds:
      - task: pre-commit-install
      - task: sync

  # =============================================================
  # Quality (test, lint, fix)
  # =============================================================
  test:
    desc: Run Tests
    cmds:
      - uv run -- pytest {{.CLI_ARGS}}
      - go test ./...
    deps:
      - task: sync
        vars:
          UV_PYTHON: '{{.UV_PYTHON}}'
          CLI_ARGS: --quiet
    env:
      GITHUB_TOKEN: placeholder
      UV_PYTHON: '{{.UV_PYTHON}}'

  test:matrix:
    desc: Run Tests with different Python versions
    cmds:
      - for:
          matrix:
            PYTHON: ['3.9', '3.10', '3.11', '3.12', '3.13', '3.14']
        task: test
        vars:
          UV_PYTHON: '{{.ITEM.PYTHON}}'

  lint:
    desc: Run All Checks (exits non-zero if anything is non-compliant)
    cmds:
      - uv tool run --isolated pre-commit run --all-files --show-diff-on-failure
    deps: [sync]

  fix:
    desc: Run All Auto-Fixers (formatters + linter --fix)
    cmds:
      - uv tool run --isolated pre-commit run --all-files
    deps: [sync]

  # =============================================================
  # Build & Distribution
  # =============================================================
  dist:
    desc: Build the Project Artifacts
    cmds:
      - cmd: rm -rf {{.ROOT_DIR}}/dist
      - cmd: uv build

  docker:
    desc: Build both Python and Go Docker Images
    cmds:
      - task: docker:python
        vars:
          { CLI_ARGS: '{{.CLI_ARGS}}', RELEASE_VERSION: '{{.RELEASE_VERSION}}' }
      - task: docker:go
        vars:
          { CLI_ARGS: '{{.CLI_ARGS}}', RELEASE_VERSION: '{{.RELEASE_VERSION}}' }

  docker:python:
    desc: Build Python Docker Image
    cmd: |
      docker buildx build \
        --tag {{.DOCKER_REPO}}:{{.RELEASE_VERSION}} \
        --tag {{.DOCKER_REPO}}:latest \
        --file {{.ROOT_DIR}}/Dockerfile \
        --platform linux/amd64,linux/arm64 {{.CLI_ARGS | default ""}} \
        {{.ROOT_DIR}}
    vars:
      RELEASE_VERSION: '{{.RELEASE_VERSION | default "local"}}'
    requires:
      vars: [DOCKER_REPO]

  docker:go:
    desc: Build Go Docker Image
    cmd: |
      docker buildx build \
        --tag {{.DOCKER_REPO}}:{{.RELEASE_VERSION}}-go \
        --tag {{.DOCKER_REPO}}:latest-go \
        --file {{.ROOT_DIR}}/Dockerfile.golang \
        --platform linux/amd64,linux/arm64 {{.CLI_ARGS | default ""}} \
        {{.ROOT_DIR}}
    vars:
      RELEASE_VERSION: '{{.RELEASE_VERSION | default "local"}}'
    requires:
      vars: [DOCKER_REPO]

  build:
    desc: Build the Project Artifacts
    cmds:
      - task: dist
      - task: docker
      - task: docs

  # =============================================================
  # Release
  # =============================================================
  publish:
    desc: Publish the Project Artifacts
    cmds:
      - task: docker
        vars:
          CLI_ARGS: --push
    requires:
      vars: [CI, RELEASE_VERSION]

  # =============================================================
  # Run
  # =============================================================
  run:
    desc: Run Command within Project (requires "--")
    interactive: true
    cmds:
      - uv run -- {{.CLI_ARGS}}

  # =============================================================
  # Documentation
  # =============================================================
  docs:
    desc: Build Documentation Site (use "-- serve" to serve locally)
    cmds:
      - uv run --group docs -- mkdocs {{.CLI_ARGS | default "build"}}

  # =============================================================
  # Maintenance
  # =============================================================
  lock:
    desc: Regenerate the Project Lockfile
    cmds:
      - uv lock
    env:
      UV_LOCKED: '0'

  # =============================================================
  # Internal
  # =============================================================
  sync:
    desc: Install Project Dependencies
    internal: true
    cmds:
      - uv sync --all-extras {{.CLI_ARGS}}
    env:
      UV_PYTHON: '{{.UV_PYTHON}}'

  pre-commit-install:
    desc: Install Pre-Commit Hooks
    internal: true
    cmds:
      - cmd: |
          if [ "{{.CI | default 0}}" = "0" ]; then
              uv tool run --isolated pre-commit install --install-hooks
          fi
        silent: true
    status:
      - test ! -f {{.ROOT_DIR}}/.pre-commit-config.yaml
