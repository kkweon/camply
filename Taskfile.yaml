# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: '3'

vars:
  DOCKER_REPO: ghcr.io/kkweon/camply
  # linux/darwin × amd64/arm64 — the platforms the release binaries cover
  PLATFORMS: 'linux/amd64 linux/arm64 darwin/amd64 darwin/arm64'

tasks:
  # =============================================================
  # Setup
  # =============================================================
  default:
    desc: List Tasks
    cmds:
      - task --list-all

  install:
    desc: Install Pre-Commit Hooks
    cmds:
      - task: pre-commit-install

  # =============================================================
  # Quality (test, lint, fix)
  # =============================================================
  test:
    desc: Run Tests
    cmds:
      - go test ./... {{.CLI_ARGS}}

  lint:
    desc: Run All Checks (exits non-zero if anything is non-compliant)
    cmds:
      - uv tool run --isolated pre-commit run --all-files --show-diff-on-failure

  fix:
    desc: Run All Auto-Fixers (formatters + linter --fix)
    cmds:
      - uv tool run --isolated pre-commit run --all-files

  # =============================================================
  # Build & Distribution
  # =============================================================
  dist:
    desc: Cross-Compile the Release Binaries
    cmds:
      - cmd: rm -rf {{.ROOT_DIR}}/dist
      - cmd: mkdir -p {{.ROOT_DIR}}/dist
      - for: { var: PLATFORMS }
        cmd: |
          GOOS="$(echo {{.ITEM}} | cut -d/ -f1)" \
          GOARCH="$(echo {{.ITEM}} | cut -d/ -f2)" \
          CGO_ENABLED=0 \
          go build -trimpath -ldflags "-s -w -X main.version={{.RELEASE_VERSION}}" \
            -o {{.ROOT_DIR}}/dist/camply_{{.RELEASE_VERSION}}_$(echo {{.ITEM}} | tr / _) \
            ./cmd/camply
      # Checksums are relative to dist/ so `sha256sum -c` works after download
      - cmd: cd {{.ROOT_DIR}}/dist && sha256sum camply_* > checksums.txt
    vars:
      RELEASE_VERSION: '{{.RELEASE_VERSION | default "local"}}'

  docker:
    desc: Build the Docker Image
    cmd: |
      docker buildx build \
        --tag {{.DOCKER_REPO}}:{{.RELEASE_VERSION}} \
        --tag {{.DOCKER_REPO}}:latest \
        --build-arg VERSION={{.RELEASE_VERSION}} \
        --file {{.ROOT_DIR}}/Dockerfile \
        --platform linux/amd64,linux/arm64 {{.CLI_ARGS | default ""}} \
        {{.ROOT_DIR}}
    vars:
      RELEASE_VERSION: '{{.RELEASE_VERSION | default "local"}}'
    requires:
      vars: [DOCKER_REPO]

  build:
    desc: Build the Project Artifacts
    cmds:
      - task: dist
        vars: { RELEASE_VERSION: '{{.RELEASE_VERSION}}' }
      - task: docker
        vars: { RELEASE_VERSION: '{{.RELEASE_VERSION}}' }

  # =============================================================
  # Release
  # =============================================================
  publish:
    desc: Publish the Project Artifacts
    cmds:
      - task: docker
        vars:
          CLI_ARGS: --push
          RELEASE_VERSION: '{{.RELEASE_VERSION}}'
    requires:
      vars: [CI, RELEASE_VERSION]

  # =============================================================
  # Run
  # =============================================================
  run:
    desc: Run Command within Project (requires "--")
    interactive: true
    cmds:
      - go run ./cmd/camply {{.CLI_ARGS}}

  # =============================================================
  # Internal
  # =============================================================
  pre-commit-install:
    desc: Install Pre-Commit Hooks
    internal: true
    cmds:
      - cmd: |
          if [ "{{.CI | default 0}}" = "0" ]; then
              uv tool run --isolated pre-commit install --install-hooks
          fi
        silent: true
    status:
      - test ! -f {{.ROOT_DIR}}/.pre-commit-config.yaml
