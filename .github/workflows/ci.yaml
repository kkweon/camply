name: CI

on:
    push:
        branches:
            - develop
    pull_request:
        branches:
            - develop

jobs:
    test:
        env:
            CAMPLY_LOG_HANDLER: PYTHON
        runs-on: ubuntu-latest
        strategy:
            fail-fast: true
            matrix:
                include:
                    - { name: Python 3.14, python: "3.14" }
                    - { name: Python 3.13, python: "3.13" }
                    - { name: Python 3.12, python: "3.12" }
                    - { name: Python 3.11, python: "3.11" }
                    - { name: Python 3.10, python: "3.10" }
                    - { name: Python 3.9, python: "3.9" }
        permissions:
            contents: read
            id-token: write
            pull-requests: write
        steps:
            - name: lint
              id: lint
              uses: juftin/actions/taskfile@v1
              continue-on-error: true
              with:
                  checkout: true
                  setup-uv: true
                  task: lint
                  install: true
                  github-token: ${{ secrets.GITHUB_TOKEN }}
                  annotations-ruff: true
            - name: check
              id: check
              uses: juftin/actions/taskfile@v1
              continue-on-error: true
              with:
                  task: check
                  setup-task: false
                  annotations-mypy: true
            - name: Raise Errors For Failures
              if: |
                  steps.lint.outcome != 'success'
              run: |
                  echo "Lint: ${{ steps.lint.outcome }}"
                  echo "Check: ${{ steps.check.outcome }}"
                  exit 1
            - name: test
              uses: juftin/actions/taskfile@v1
              with:
                  setup-task: false
                  task: test
                  install: true
                  github-token: ${{ secrets.GITHUB_TOKEN }}
                  annotations-pytest: ${{ matrix.python == '3.12' && true || false }}
                  pytest-coverage: ${{ matrix.python == '3.12' && github.event_name == 'pull_request' && true || false }}
              env:
                  UV_PYTHON: ${{ matrix.python }}

    release:
        needs: test
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        runs-on: ubuntu-latest
        permissions:
            contents: write
            issues: write
            pull-requests: write
            packages: write
            pages: write
            id-token: write
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - name: checkout
              uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
              with:
                  persist-credentials: false
            - name: setup-uv
              uses: astral-sh/setup-uv@6b9c6063abd6010835644d4c2e1bef4cf5cd0fca # v6.0.1
              
            - name: docker-hub
              uses: docker/login-action@v2
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}
            - name: version
              run: |
                  RELEASE_VERSION="${GITHUB_SHA::7}"
                  echo "RELEASE_VERSION=${RELEASE_VERSION}"
                  echo "RELEASE_VERSION=${RELEASE_VERSION}" >> ${GITHUB_ENV}
            - name: Set up QEMU
              uses: docker/setup-qemu-action@v3
            - name: docker publish
              uses: juftin/actions/taskfile@v1
              with:
                  task: publish
                  buildx: true
                  github-token: ${{ secrets.GITHUB_TOKEN }}
                  
            - name: build-docs
              uses: juftin/actions/taskfile@v1
              with:
                  task: docs
                  install: true
                  github-token: ${{ secrets.GITHUB_TOKEN }}
                  args: build
            - name: Publish Docs
              uses: juftin/actions/github-pages@v1
              id: deployment

            - name: Semantic Release
              if: github.repository_owner == 'juftin'
              uses: juftin/actions/semantic-release@v1
              with:
                  github_token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
