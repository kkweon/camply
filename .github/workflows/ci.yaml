name: CI

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

jobs:
  test:
    env:
      CAMPLY_LOG_HANDLER: PYTHON
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - { name: Python 3.12, python: '3.12' }
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup-uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: 'uv.lock'

      - name: setup-go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'

      - name: setup-task
        uses: arduino/setup-task@v2
        with:
          version: 3.x

      - name: pre-commit
        uses: pre-commit/action@v3.0.1

      - name: test
        env:
          UV_PYTHON: ${{ matrix.python }}
        run: |
          task test

  release:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      packages: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: setup-node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: setup-uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: setup-task
        uses: arduino/setup-task@v2
        with:
          version: 3.x

      - name: docker-hub
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Semantic Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm install -g semantic-release @semantic-release/git @semantic-release/changelog @semantic-release/exec semantic-release-gitmoji @semantic-release/github
          npx semantic-release

      - name: build-docs
        run: |
          task docs

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Publish Docs
        uses: actions/deploy-pages@v4
        id: deployment
