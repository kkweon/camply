name: CI

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: checkout
        uses: actions/checkout@v7

      # Python comes from .python-version, Go from the go.mod `go` directive -
      # the same sources uv and go read locally. Nothing here is CI-specific.
      - name: setup-uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: 'uv.lock'

      - name: setup-go
        uses: actions/setup-go@v7
        with:
          # `go 1.26` carries no patch, so this resolves the newest 1.26.x
          go-version-file: go.mod

      - name: setup-task
        uses: arduino/setup-task@v3.0.0
        with:
          version: 3.x
          # No default on this input, unlike setup-uv/setup-go. Without it the
          # release lookup is unauthenticated and gets rate limited.
          repo-token: ${{ github.token }}

      - name: cache-pre-commit
        uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: lint
        run: task lint

      - name: test
        run: task test

  release:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      packages: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: checkout
        uses: actions/checkout@v7
        with:
          # semantic-release pushes the version bump and needs full history
          persist-credentials: true
          fetch-depth: 0

      - name: setup-node
        uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - name: setup-uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: 'uv.lock'

      - name: setup-task
        uses: arduino/setup-task@v3.0.0
        with:
          version: 3.x
          repo-token: ${{ github.token }}

      - name: ghcr-login
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: setup-qemu
        uses: docker/setup-qemu-action@v4

      - name: setup-buildx
        uses: docker/setup-buildx-action@v4

      # Only the plugins referenced by .releaserc.json
      - name: semantic-release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          npm install -g semantic-release @semantic-release/exec @semantic-release/git @semantic-release/github
          npx semantic-release

      # Rebuilds outside of a release too, so docs deploy on every push
      - name: build-docs
        run: task docs

      - name: upload-pages-artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: deploy-pages
        uses: actions/deploy-pages@v5
        id: deployment
