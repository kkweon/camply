# yaml-language-server: $schema=https://schemastore.org/pre-commit-config.json

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-merge-conflict
      - id: mixed-line-ending
      - id: no-commit-to-branch
        args: [--branch, main, --branch, master]

  - repo: https://github.com/golangci/golangci-lint
    rev: v2.13.2
    hooks:
      # -full lints the whole module; the plain `golangci-lint` id only checks
      # --new-from-rev HEAD, which would let existing issues slide in CI
      - id: golangci-lint-full

  - repo: https://github.com/dnephin/pre-commit-golang
    rev: v0.5.1
    hooks:
      - id: go-mod-tidy

  - repo: local
    hooks:
      - id: goimports
        name: goimports
        description: Runs goimports formatter
        entry: go run golang.org/x/tools/cmd/goimports@latest -w
        language: system
        types:
          - go
      - id: gofumpt
        name: gofumpt
        description: Runs gofumpt code formatter
        entry: go run mvdan.cc/gofumpt@latest -w
        language: system
        types:
          - go
      - id: prettier
        name: prettier
        description: Runs Prettier Code Formatter
        entry: prettier --write --ignore-unknown
        language: node
        types:
          - text
        additional_dependencies:
          - prettier@3.6.2
        exclude: |
          (?x)(
            PULL_REQUEST_TEMPLATE.md|
            .github/semantic_release/release_notes.hbs
          )
